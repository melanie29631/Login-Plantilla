<canvas id="smokeCanvas"></canvas>

<div class="login-container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <p-card styleClass="login-card"
        [style]="{ width: '25rem', overflow: 'hidden', display: 'flex', 'flex-direction': 'column', 'align-items': 'center' }">
        <ng-template #title><i class="pi pi-user"></i> Inicio de sesión </ng-template>
        <div style="margin-top: 1rem;"></div>


        <div style="margin-bottom: 1.5rem;">
            <p-floatlabel>
                <input id="username" pInputText [(ngModel)]="usuario" required />
                <label for="username">Usuario</label>
            </p-floatlabel>
        </div>

        <div style="margin-bottom: 0.5rem;">
            <p-floatlabel>
                <input id="password" pInputText [(ngModel)]="password" required type="password" />
                <label for="password">Contraseña</label>
            </p-floatlabel>
        </div>

        <label>Olvidaste tu contraseña?</label>

        <ng-template #footer>
            <div class="flex gap-4 mt-1" style="display: flex; justify-content: center; width: 100%;">
                <p-button label="Ingresar" class="w-full" styleClass="w-full" (click)="login()" />
            </div>
        </ng-template>
    </p-card>
</div>

<script> const canvas = document.getElementById('smokeCanvas'); const ctx = canvas.getContext('2d'); canvas.width = window.innerWidth; canvas.height = window.innerHeight; const particles = []; function createParticle() {
        const x = Math.random() * canvas.width; const y = canvas.height + 50; const size = Math.random() * 80 + 20; const speedY = Math.random() * -1.5 - 0.5; const opacity = Math.random() * 0.3 + 0.2; const hue = 120 + Math.random() * 40;
        particles.push({ x, y, size, speedY, opacity, hue });
    } function drawParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); for (let p of particles) { ctx.beginPath(); const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size); gradient.addColorStop(0, `hsla(${p.hue}, 100%, 50%, ${p.opacity})`); gradient.addColorStop(1, `hsla(${p.hue}, 100%, 50%, 0)`); ctx.fillStyle = gradient; ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); p.y += p.speedY; p.opacity -= 0.001; }
        // eliminar partículas invisibles
        for (let i = particles.length - 1; i >= 0; i--) { if (particles[i].opacity <= 0) particles.splice(i, 1); }
    } function animate() { drawParticles(); if (particles.length < 200) createParticle(); requestAnimationFrame(animate); } animate(); </script>
